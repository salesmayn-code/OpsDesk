services:
  postgres:
    image: postgres:16-alpine
    container_name: opsdesk-postgres
    environment:
      POSTGRES_USER: opsdesk
      POSTGRES_PASSWORD: opsdesk
      POSTGRES_DB: opsdesk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsdesk -d opsdesk"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: opsdesk-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: opsdesk-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
